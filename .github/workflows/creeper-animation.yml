name: Generate Creeper Contribution Animation

on:
  push:
    paths:
      - "scripts/generate_creeper.py"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: pip install pillow

      - name: Generate animation
        run: python scripts/generate_creeper.py

      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/creeper-contribution.gif
          git diff --cached --quiet || git commit -m "chore: update creeper contribution animation"
          git push
